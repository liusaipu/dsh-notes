[package]
name = "quick-memo"
version = "0.1.0"
description = "Quick Memo desktop app"
authors = ["liusaipu"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "quick_memo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
imap = "=3.0.0-alpha.15"
