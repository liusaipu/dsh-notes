name: Desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Tauri app
        working-directory: desktop
        run: npm run tauri build

      - name: Prepare portable Windows build
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item src-tauri/target/release/quick-memo.exe portable/ -ErrorAction Stop
          Copy-Item src-tauri/target/release/*.dll portable/ -ErrorAction SilentlyContinue
          Compress-Archive -Path portable/* -DestinationPath quick-memo-windows-portable.zip -Force

      - name: Windows startup and migration smoke
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stateDir = Join-Path $env:APPDATA 'com.liusaipu.quickmemo'
          New-Item -ItemType Directory -Force $stateDir | Out-Null
          $legacy = @'
          {"version":1,"deviceId":"ci-legacy","sequence":1,"notes":{"ci-note":{"id":"ci-note","text":"ci #smoke","createdAt":1,"updatedAt":2,"revBy":"ci-legacy","deleted":false,"syncedRev":null}},"sync":{}}
          '@
          Set-Content -Path (Join-Path $stateDir 'state.json') -Value $legacy -Encoding UTF8
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--disable-gpu'
          $exe = (Resolve-Path 'src-tauri/target/release/quick-memo.exe').Path
          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) {
            throw "Quick Memo exited during startup with code $($app.ExitCode)"
          }
          $statePath = Join-Path $stateDir 'state.json'
          if (-not (Test-Path $statePath)) { throw 'state.json was not written' }
          $state = Get-Content $statePath -Raw | ConvertFrom-Json
          if ($null -eq $state.notebooks) { throw 'legacy state was not migrated to notebooks' }
          if ($state.activeId -ne 'default') { throw "unexpected active notebook: $($state.activeId)" }
          if (-not ($state.notebooks[0].notes.PSObject.Properties.Name -contains 'ci-note')) {
            throw 'migrated note is missing'
          }
          Stop-Process -Id $app.Id -Force
          Write-Host 'Windows startup + legacy migration smoke passed'

      - name: Upload portable Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: quick-memo-windows-portable
          path: desktop/quick-memo-windows-portable.zip

      - name: Upload macOS bundles
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: quick-memo-macos
          path: |
            desktop/src-tauri/target/release/bundle/macos/*.app
            desktop/src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload Windows bundles
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: quick-memo-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
  release:
    name: Publish desktop release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release files
        run: ls -lah artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp artifacts/dmg/*.dmg release/
          cp artifacts/nsis/*.exe release/
          cp artifacts/msi/*.msi release/
          cp artifacts/quick-memo-windows-portable.zip release/

      - name: Generate checksums
        working-directory: release
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Quick Memo Desktop 0.3.0 (unsigned MVP)
          body_path: desktop/RELEASE_NOTES_0.3.0.md
          prerelease: true
          make_latest: "false"
          fail_on_unmatched_files: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.msi
            release/SHA256SUMS.txt

